<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>青蛙跳出井口</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    #video-container {
      position: absolute;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      background: black;
      z-index: 100;
    }
    #video-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .video-overlay {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      padding: 20px 50px;
      border-radius: 30px;
      font-size: 48px;
      font-weight: bold;
      color: #fff;
      z-index: 200;
      animation: popText 1s infinite alternate;
    }
    @keyframes popText {
      from { transform: translateX(-50%) scale(1); }
      to { transform: translateX(-50%) scale(1.1); }
    }
    .video-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 20px;
      font-size: 24px;
      cursor: pointer;
      z-index: 200;
    }
  </style>
</head>
<body class="jump-page">

<div class="jump-scene" id="jumpScene">

  <img src="images/青蛙跳出井口.png" class="jump-bg" id="jumpBg">

  <button class="jump-btn" id="jumpBtn">
    跳
  </button>

  <div class="world-scene" id="worldScene">

    <img src="images/小鸟和青蛙看到广阔的天地.png" class="world-bg">

    <div class="world-text">
      哇！原来天这么大呀！
    </div>

  </div>

</div>

<div id="video-container">
  <video id="jumpVideo" controls>
    <source src="video/青蛙跳出井.mp4" type="video/mp4">
    您的浏览器不支持视频播放
  </video>
  <div class="video-overlay">哇！原来天这么大呀！</div>
  <button class="video-close" onclick="closeVideo()">关闭</button>
</div>

<script>
const jumpBtn = document.getElementById('jumpBtn');
const worldScene = document.getElementById('worldScene');
const videoContainer = document.getElementById('video-container');
const jumpVideo = document.getElementById('jumpVideo');

jumpBtn.onclick = () => {
  jumpBtn.classList.add('jumping-big');
  
  setTimeout(() => {
    worldScene.style.display = 'none';
    videoContainer.style.display = 'flex';
    
    jumpVideo.load();
    jumpVideo.play().then(() => {
      console.log('视频播放成功');
    }).catch(err => {
      console.log('自动播放被阻止，尝试静音播放');
      jumpVideo.muted = true;
      jumpVideo.play();
    });
  }, 1200);
};

function closeVideo() {
  videoContainer.style.display = 'none';
  jumpVideo.pause();
  jumpVideo.currentTime = 0;
  jumpBtn.classList.remove('jumping-big');
}
</script>

</body>
</html>
